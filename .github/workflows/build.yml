name: Android CI and release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Tests, lint and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shared version and release rules
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/release.py metadata
          bash -n scripts/package_apk.sh
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Android SDK and packages
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        with:
          cmdline-tools-version: '12266719'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          validate-wrappers: true
      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace
      - name: Package debug artifact and checksum
        run: bash scripts/package_apk.sh debug
      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Vic2Ray-debug-${{ github.sha }}
          path: dist/debug/
          if-no-files-found: error
          retention-days: 14
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          retention-days: 14

  release:
    name: Sign and publish new version
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: vic2ray-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Decide whether this version needs publication
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py plan --github-output "$GITHUB_OUTPUT"
      - name: Set up JDK 21
        if: steps.plan.outputs.publish == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Android SDK and packages
        if: steps.plan.outputs.publish == 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        with:
          cmdline-tools-version: '12266719'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle and validate wrapper
        if: steps.plan.outputs.publish == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          validate-wrappers: true
      - name: Build with stable release signing
        if: steps.plan.outputs.publish == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/vic2ray-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo 'All four ANDROID signing secrets are required for a release.' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Verify package and signing certificate
        if: steps.plan.outputs.publish == 'true'
        env:
          APP_VERSION: ${{ steps.plan.outputs.version }}
          APP_VERSION_CODE: ${{ steps.plan.outputs.code }}
        run: |
          APK="app/build/outputs/apk/release/Vic2Ray-VPN-${APP_VERSION}-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          test "$(apkanalyzer manifest application-id "$APK")" = com.vic2ray
          test "$(apkanalyzer manifest version-name "$APK")" = "$APP_VERSION"
          test "$(apkanalyzer manifest version-code "$APK")" = "$APP_VERSION_CODE"
          bash scripts/package_apk.sh release
      - name: Upload signed build artifact
        if: steps.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Vic2Ray-release-${{ steps.plan.outputs.version }}
          path: dist/release/
          if-no-files-found: error
      - name: Create immutable version tag and publish
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          APP_VERSION: ${{ steps.plan.outputs.version }}
          CREATE_TAG: ${{ steps.plan.outputs.create_tag }}
        run: |
          if [[ "$CREATE_TAG" == true ]]; then
            git push origin "$GITHUB_SHA:refs/tags/$RELEASE_TAG"
          fi
          gh release create "$RELEASE_TAG" dist/release/*.apk dist/release/SHA256SUMS \
            --verify-tag --target "$GITHUB_SHA" --title "Vic2Ray VPN $APP_VERSION" \
            --generate-notes --latest
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/vic2ray-release.jks"
