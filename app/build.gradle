plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def appVersion = new Properties()
rootProject.file('version.properties').withInputStream { appVersion.load(it) }
def releaseStorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def signingValues = [releaseStorePath, System.getenv('ANDROID_KEYSTORE_PASSWORD'),
                     System.getenv('ANDROID_KEY_ALIAS'), System.getenv('ANDROID_KEY_PASSWORD')]
def hasReleaseSigning = signingValues.every { it != null && !it.isEmpty() }

android {
    namespace 'com.vic2ray'
    compileSdk 35

    defaultConfig {
        applicationId "com.vic2ray"
        minSdk 24
        targetSdk 35
        versionCode appVersion.getProperty('versionCode').toInteger()
        versionName appVersion.getProperty('versionName')

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        ndk {
            // Keep the phone and emulator architectures supported by the bundled core.
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStorePath)
                storePassword signingValues[1]
                keyAlias signingValues[2]
                keyPassword signingValues[3]
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "Vic2Ray-VPN-${appVersion.getProperty('versionName')}-${variant.name}.apk"
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }
    bundle {
        language {
            // Both in-app languages must stay available for offline language switching.
            enableSplit = false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.4.0'
    }
}

// A release must never silently produce an unsigned APK.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project &&
            it.name in ['assembleRelease', 'bundleRelease', 'packageRelease'] } && !hasReleaseSigning) {
        throw new GradleException('Release signing requires ANDROID_KEYSTORE_PATH, ' +
                'ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD.')
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation 'androidx.activity:activity-compose:1.7.0'
    implementation platform('androidx.compose:compose-bom:2023.03.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material:material'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    implementation files('libs/libv2ray.aar')
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
